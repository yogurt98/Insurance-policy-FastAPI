# docker-compose.yml
version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: policy_db
    restart: always
    environment:
      POSTGRES_DB: policy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: policy_test_db  # 测试用数据库
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: policy_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/policy_db
      SECRET_KEY: super-secret-key-change-me-in-production-2026
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    container_name: policy_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery_worker:
    build: .
    command: celery -A app.celery_worker worker --loglevel=info --pool=gevent
    container_name: policy_celery
    restart: always
    depends_on:
      - redis
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
  redis_data: