name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 1. 配置依赖服务
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: policy_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ✅ 新增 Redis 服务，供依赖测试使用
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # ✅ 小优化：开启 pip 缓存，加快后续 CI 速度

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio httpx # 确保测试依赖被安装

      - name: Lint with flake8
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # 暂时允许稍长一点的代码行，防止过严导致 CI 频繁失败 (可按需调整)
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run pytest
        env:
          # ✅ 为应用配置本地数据库和 Redis
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/policy_db
          # ✅ 专门传给测试脚本用的 URL，使用 localhost
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/policy_db
          REDIS_HOST: localhost  # ✅ 新增这一行！告诉应用去哪里找 Redis
          SECRET_KEY: super-secret-key-for-ci-testing
          ENVIRONMENT: test
        run: |
          pytest app/tests/ -v

      - name: Build Docker image
        # ✅ 添加缓存参数，加快镜像构建速度
        run: docker build -t insurance-policy-fastapi:latest .